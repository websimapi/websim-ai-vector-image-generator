<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vector Image Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>AI Vector Image Generator</h1>
        <div class="input-container">
            <input type="text" id="promptInput" placeholder="Describe the image you want to generate...">
            <select id="aspectRatio">
                <option value="1:1">Square (1:1)</option>
                <option value="16:9">Landscape (16:9)</option>
                <option value="9:16">Portrait (9:16)</option>
                <option value="4:3">Standard (4:3)</option>
                <option value="3:2">Photo (3:2)</option>
            </select>
            <button id="generateBtn">Generate</button>
        </div>
        
        <div class="stages-container">
            <div class="stage" id="stageOriginal">
                <h2>Original Image</h2>
                <div class="image-container" id="originalImageContainer">
                    <div class="placeholder">Your image will appear here</div>
                </div>
            </div>
            
            <div class="stage" id="stageVector">
                <h2>Vector Image</h2>
                <div class="image-container" id="vectorImageContainer">
                    <div class="placeholder">Vector conversion will appear here</div>
                </div>
                <button id="downloadBtn" disabled>Download SVG</button>
            </div>
        </div>
        
        <div class="status" id="statusMessage"></div>
    </div>

    <!-- Changed from problematic CDN to a reliable source -->
    <script src="https://cdn.jsdelivr.net/npm/potrace@2.1.8/dist/potrace.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
